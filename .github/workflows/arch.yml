# Lane A: build and test the Keyboard against Arch Linux's current packages,
# the same Qt, Frameworks and Plasma the tablet installs. Runs ./verify.sh, so
# this check and a local run agree.
name: Arch current

on:
  push:
    # Branches only: a release tag starts nothing.
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # Text-only changes (Markdown files and nothing else) skip the build: the
  # check still runs and passes, so a README edit merges in about a minute.
  # A scheduled or manual run, or any other file changed, runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          code=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base"...HEAD)"
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in *.md) ;; *) code=true ;; esac
              done <<< "$files"
            fi
            printf 'Changed:\n%s\n' "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          # The image lists one mirror. A dropped connection there fails the
          # whole install, so pacman gets others to fall back to.
          printf 'Server = %s/$repo/os/$arch\n' https://geo.mirror.pkgbuild.com https://mirrors.kernel.org/archlinux https://mirror.rackspace.com/archlinux >> /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed \
            base-devel clang cmake extra-cmake-modules git ninja pkgconf \
            qt6-base qt6-declarative qt6-virtualkeyboard qt6-wayland \
            kcoreaddons ki18n kcmutils kconfig kcrash libplasma layer-shell-qt \
            libxkbcommon wayland wayland-protocols plasma-wayland-protocols dbus
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - name: Run ./verify.sh
        if: needs.changes.outputs.code == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./verify.sh

  # The sealed sessions: each starts a compositor of its own with the Keyboard
  # as its input method, touches it the way a person would, and asks the
  # compositor what happened. They build nothing of their own.
  sessions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
      # kwin_wayland carries the capability to raise its own priority, and a
      # container without it may not run the binary at all.
      options: --cap-add=SYS_NICE
    steps:
      - name: Install build and session dependencies
        run: |
          # Held on Arch's last Plasma 6.7 day from the Arch Linux Archive.
          # KWin 6.8's virtual backend wants a GPU render device for OpenGL,
          # which a hosted runner lacks, so every session would stop at start.
          # Move the date on once the sessions run headless on 6.8.
          echo 'Server = https://archive.archlinux.org/repos/2026/10/14/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed \
            base-devel clang cmake extra-cmake-modules git ninja pkgconf \
            qt6-base qt6-declarative qt6-virtualkeyboard qt6-wayland \
            kcoreaddons ki18n kcmutils kconfig kcrash libplasma layer-shell-qt \
            libxkbcommon wayland wayland-protocols \
            kwin plasma-wayland-protocols python-gobject dbus mesa
      - uses: actions/checkout@v5
      - name: Build the Keyboard
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      - name: Run every sealed session
        env:
          SHUFFLE_KEYBOARD_BUILD: ${{ github.workspace }}/build
        run: |
          failed=()
          for session in tests/verify-*.sh; do
            echo "::group::${session}"
            status=0
            "${session}" || status=$?
            echo "::endgroup::"
            case "${status}" in
              0) echo "passed: ${session}" ;;
              77) echo "skipped: ${session}" ;;
              *) echo "FAILED: ${session}"; failed+=("${session}") ;;
            esac
          done
          ((${#failed[@]} == 0)) || { printf 'Failed: %s\n' "${failed[@]}"; exit 1; }
