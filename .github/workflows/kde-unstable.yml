#
# Builds and tests the Keyboard against the next Plasma before it ships, from
# Arch Linux's kde-unstable repository. A red run here is an early warning
# about the coming Plasma release, not a failure of the released one. A push
# that changes the source or the tests runs it too, so a port to the next
# Plasma is checked before it merges.
name: Next Plasma (kde-unstable)

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kde-unstable.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "autotests/**"

concurrency:
  group: kde-unstable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/docker/library/archlinux:latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/runtime
    steps:
      - name: Enable kde-unstable and the testing repositories it builds on
        run: |
          # kde-unstable sits above the testing repositories, which sit above
          # the stable ones, as Arch documents for this repository.
          sed -i '0,/^\[core\]/s//[kde-unstable]\nInclude = \/etc\/pacman.d\/mirrorlist\n\n[core-testing]\nInclude = \/etc\/pacman.d\/mirrorlist\n\n[extra-testing]\nInclude = \/etc\/pacman.d\/mirrorlist\n\n[core]/' /etc/pacman.conf
          grep -n '^\[' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git base-devel cmake ninja python \
            extra-cmake-modules qt6-base qt6-declarative qt6-virtualkeyboard \
            qt6-wayland qt6-tools kcoreaddons ki18n kcmutils kconfig kcrash \
            libplasma libxkbcommon wayland wayland-protocols \
            plasma-wayland-protocols layer-shell-qt

      - uses: actions/checkout@v5

      - name: Record what was tested against
        run: |
          {
            echo "### Tested against"
            echo '```'
            pacman -Q libplasma layer-shell-qt kcoreaddons qt6-base qt6-virtualkeyboard qt6-wayland
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build and test
        # Only what the next Plasma can change: the build and the tests.
        # Formatting and licence headers depend on the tools, not on Plasma,
        # and ./verify.sh checks them on every change.
        run: |
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          ctest --test-dir build --output-on-failure
